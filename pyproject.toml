[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reqcheck"
version = "1.0.0"
description = "ИИ-агент статической проверки требований (ISO/IEC/IEEE 29148, IEEE 830)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0",
    "anthropic>=2.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
reqcheck = "reqcheck.cli:main"

[tool.setuptools]
packages = ["reqcheck", "reqcheck.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
